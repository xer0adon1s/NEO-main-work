# Pipeline registry — what scripts exist, where they run, and what they own.
# Paths are relative to repo root (NEO_HOME / NEO_DIR).
# Agents: read this + AGENTS.md before adding or modifying scripts.

babysteps:
  file: recon/babysteps.sh
  runs: local
  phase: recon
  init_project: true
  requires: [rustscan, nmap, gobuster, smbclient, curl]
  owns:
    PORTS: set
    NMAP: set
    SERVICES: append
    TODO: append
  finish:
    phase: recon
    log: smart

analyze-recon:
  file: recon/analyze-recon.sh
  runs: local
  phase: recon
  init_project: false
  requires: [curl, jq]
  # API: ANTHROPIC_API_KEY + optional anthropic.workspace (wrkspc_...) for identity-linked keys
  owns:
    AI-TRIAGE: append
  finish:
    phase: recon
    log: smart

borg:
  file: borg/borg.sh
  runs: local
  phase: any
  init_project: false
  requires: [curl, jq]
  # Claude Code (claude -p) or ANTHROPIC_API_KEY; gated downloads (human y/N)
  owns:
    BORG: append
    TODO: append
  finish:
    phase: dynamic
    log: smart

# Pause-menu library (not a standalone script — wired from neo.sh)
neo-conductor:
  file: lib/neo-conductor.sh
  integration_status: prototyped_v0.6
  runs: local
  phase: any
  init_project: false
  notes: Unified mission AI bundles; proactive Borg/payload sequencing; phase hooks (NEO_CONDUCTOR=1). Prototype — see FEATURE-STATUS.md.

neo-feedback:
  file: lib/neo-feedback.sh
  integration_status: prototyped_v0.6
  runs: local
  phase: any
  init_project: false
  notes: Pause-menu ack + working indicators (NEO_FEEDBACK=1). Prototype — see FEATURE-STATUS.md.

neo-payload:
  file: lib/neo-payload.sh
  runs: local
  phase: any
  init_project: false
  requires: [curl, jq]
  # Claude Code (claude -p) or ANTHROPIC_API_KEY; [p] payload suggest (tool-picker,
  # copy-paste output) / [z] analyze failures (foothold only, after a first attempt —
  # reviews NEO's log plus a tmux terminal-log capture when available)
  # Phase-gated: recon, foothold (until shell), privesc, post
  owns:
    PAYLOAD: append
    TODO: append
    LOG: append
  finish:
    phase: dynamic
    log: smart

# tmux auto-wrap + terminal-log capture (not a standalone script — wired from neo.sh)
neo-tmux:
  file: lib/neo-tmux.sh
  runs: local
  phase: any
  init_project: false
  requires: [tmux]
  # Re-execs neo.sh into a named tmux session (neo-<project>) on real interactive
  # launches, so Analyze Failures can reliably capture what was tried manually outside
  # NEO. Opt out with NEO_TMUX_WRAP=0. Never wraps piped/non-interactive runs.

# Operator workbench — dedicated tmux pane + try/analyze loop (P20)
neo-operator-pane:
  file: lib/neo-operator-pane.sh
  runs: local
  phase: any
  init_project: false
  requires: [tmux]
  # Split neo-<project> session: conductor pane + neo-operator work pane.
  # send-keys, capture-pane for [t] try command.

neo-workbench:
  file: lib/neo-workbench.sh
  runs: local
  phase: any
  init_project: false
  requires: [jq, tmux]
  # [t] try (permission gate) → capture → AI analyze → repeat until foothold.
  # [o] open operator shell. Phase-gated: recon, foothold, privesc, post.
  owns:
    WORKBENCH: append
    PAYLOAD: append
    FOOTHOLD: append
    LOG: append
  finish:
    phase: dynamic
    log: smart

